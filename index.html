<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-header">
    <div class="header-container">
        <div class="header-left">
            <h1 class="header-title">🎓 Welcome to Student Management System</h1>
        </div>
        <nav class="header-nav">
            <a href="#" class="nav-link active">Home</a>
            <a href="#about" class="nav-link">About</a>
            <a href="#features" class="nav-link">Features</a>
            <a href="#contact" class="nav-link">Contact</a>
        </nav>
    </div>
</header>

<div class="login-container">
    <div class="login-box">
        <h1>School Management System</h1>
        <p class="login-subtitle">Student & Staff Portal</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <div class="form-group">
                <label>Role</label>
                <select id="role" required>
                    <option value="">Select Role</option>
                    <option value="admin">Admin</option>
                    <option value="teacher">Teacher</option>
                    <option value="student">Student</option>
                </select>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <p id="message" class="error-message"></p>
        
        <div class="demo-credentials">
            <p><strong>Demo Credentials:</strong></p>
            <small>Admin: admin / 1234<br>Teacher: teacher / 1234<br>Student: student / 1234</small>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="footer-content">
        <p>&copy; 2026 School Management System | Developed by <strong>Irakarama Bernard</strong></p>
    </div>
</footer>

<script src="script.js"></script>

</body>
</html>
